global:
  resolve_timeout: 5m

route:
  group_by: ['alertname']
  group_wait: 1s
  group_interval: 5s
  repeat_interval: 1h
  receiver: 'auto-remediator-webhook'

receivers:
  - name: 'auto-remediator-webhook'
    webhook_configs:
      - url: 'http://remediator:5000/webhook'
        send_resolved: true
